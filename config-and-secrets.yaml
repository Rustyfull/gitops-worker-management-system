apiVersion: v1
kind: configMap
metadata:
  name: app-config
  namespace: worker-app
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/worker_db"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  POSTGRES_DB: "worker_db"
  POSTGRES_USER: "admin_user"

---
apiVersion: v1
kind: secret
metadata:
  name: app-secret
  namespace: worker-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: "admin_password"
  SPRING_DATASOURCE_PASSWORD: "admin_password"